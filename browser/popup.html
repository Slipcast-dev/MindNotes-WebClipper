<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <img src="icons/icon-32.png" alt="" width="20" height="20">
    <span class="brand" id="brand">MindNotes</span>
    <span id="state" class="state"></span>
  </header>

  <section id="offline" class="panel" hidden style="display:none">
    <p data-i18n="offlineText"></p>
    <button id="retry" class="secondary" data-i18n="retry"></button>
  </section>

  <section id="unpaired" class="panel" hidden style="display:none">
    <p data-i18n="pairText"></p>
    <button id="pair" data-i18n="pair"></button>
    <p id="pairWait" class="hint" data-i18n="pairWait" hidden></p>
  </section>

  <section id="noWorkspace" class="panel" hidden style="display:none">
    <p data-i18n="noWorkspaceText"></p>
    <button id="retry2" class="secondary" data-i18n="retry"></button>
  </section>

  <form id="clip" hidden style="display:none">
    <div class="modes" role="radiogroup">
      <button type="button" data-mode="article" data-i18n="modeArticle"></button>
      <button type="button" data-mode="selection" data-i18n="modeSelection"></button>
      <button type="button" data-mode="bookmark" data-i18n="modeBookmark"></button>
      <button type="button" data-mode="screenshot" data-i18n="modeScreenshot"></button>
    </div>
    <label><span data-i18n="fieldTitle"></span><input id="title" type="text" maxlength="300"></label>
    <label><span data-i18n="fieldFolder"></span><select id="parent"></select></label>
    <label><span data-i18n="fieldTags"></span><input id="tags" type="text" data-i18n-placeholder="tagsPlaceholder"></label>
    <label><span data-i18n="fieldNote"></span><textarea id="note" rows="2"></textarea></label>
    <label class="check"><input id="images" type="checkbox"> <span data-i18n="fieldImages"></span></label>
    <button id="save" type="submit" data-i18n="save"></button>
  </form>

  <section id="done" class="panel" hidden style="display:none">
    <p id="doneText"></p>
    <div class="row">
      <button id="open" data-i18n="openInApp"></button>
      <button id="again" class="secondary" data-i18n="again"></button>
    </div>
  </section>

  <p id="error" class="error" hidden style="display:none"></p>
  <script src="api.js"></script>
  <script src="popup.js"></script>
</body>
</html>
